<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PhD Command Centre</title>
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b6e'/%3E%3Cpath d='M7 12l9-5 9 5-9 5z' fill='white'/%3E%3Cpath d='M11 15v5c0 2 10 2 10 0v-5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PhD Centre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/time.css">
<link rel="stylesheet" href="css/records.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="PhD Command Centre">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" data-i18n="appName">PhD Command Centre</span>
    </a>
    <div class="topbar-actions">
      <button class="btn sync-btn" id="sync-btn" data-action="open-sync" hidden>⇅</button>
      <button class="btn timer-btn" id="timer-btn" data-action="timer" title="F">▶</button>
      <button class="btn ghost search-trigger" data-action="open-search" title="Ctrl+K">
        <span aria-hidden="true">⌕</span> <span class="hide-sm" data-i18n="search">Search</span> <kbd class="hide-sm">Ctrl K</kbd>
      </button>
      <button class="btn primary" data-action="quick-add" title="Q">+ <span class="hide-sm" data-i18n="quickAdd">Quick add</span></button>
      <span id="save-status" class="save-status" role="status"></span>
      <button class="btn ghost icon" data-action="toggle-lang" id="lang-btn" title="English / Français">FR</button>
      <button class="btn ghost icon" data-action="toggle-theme" id="theme-btn" title="Theme">◐</button>
    </div>
  </header>
  <nav class="sidebar" id="nav" aria-label="Main"></nav>
  <main id="view" class="view" tabindex="-1"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/ui.js"></script>
<script src="js/store.js"></script>
<script src="js/sync.js"></script>
<script src="js/cite.js"></script>
<script src="js/ai.js"></script>
<script src="js/notes.js"></script>
<script src="js/plan.js"></script>
<script src="js/time.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/library.js"></script>
<script src="js/views/source.js"></script>
<script src="js/views/projects.js"></script>
<script src="js/views/journal.js"></script>
<script src="js/views/argument.js"></script>
<script src="js/views/writing.js"></script>
<script src="js/views/calendar.js"></script>
<script src="js/views/meetings.js"></script>
<script src="js/views/records.js"></script>
<script src="js/views/reviews.js"></script>
<script src="js/views/cards.js"></script>
<script src="js/views/settings.js"></script>
<script src="js/views/overlays.js"></script>
<script src="js/app.js"></script>
</body>
</html>
